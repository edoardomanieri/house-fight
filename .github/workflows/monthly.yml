name: Risultato del mese

# Il primo di ogni mese manda a entrambi la notifica con il vincitore della cena
on:
  schedule:
    - cron: '17 7 1 * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    if: ${{ vars.VITE_SUPABASE_URL != '' }}
    steps:
      - name: Chiama la funzione notify
        run: |
          curl -fsS -X POST "${{ vars.VITE_SUPABASE_URL }}/functions/v1/notify" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"type":"monthly"}'
